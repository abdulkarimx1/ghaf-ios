name: Build Ghaf iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ghaf-ios-main-build
  cancel-in-progress: true

permissions:
  # write: the build publishes each new version as a GitHub release with its IPA.
  contents: write

jobs:
  build:
    name: Test and Build Ghaf
    # Runs on the developer's own Mac; this avoids GitHub-hosted Actions minutes.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate selected Xcode toolchain
        run: |
          set -euo pipefail
          echo "Selected developer directory:"
          xcode-select -p
          xcodebuild -version
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $IOS_SDK"
          case "$IOS_SDK" in
            [0-9]*) ;;
            *) echo "A valid iOS SDK was not found."; exit 1 ;;
          esac

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Prepare 1024px App Store icon
        run: |
          set -euo pipefail
          ICON="Ghaf/Assets.xcassets/AppIcon.appiconset/ghaf-app-icon.png"
          test -f "$ICON"
          ICON_TMP="${ICON%.png}-1024.png"
          sips -z 1024 1024 "$ICON" --out "$ICON_TMP"
          mv "$ICON_TMP" "$ICON"
          sips -g pixelWidth -g pixelHeight "$ICON"
          WIDTH="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')"
          test "$WIDTH" = "1024" && test "$HEIGHT" = "1024"

      - name: Test GhafCore
        run: |
          set -o pipefail
          swift test \
            --package-path Packages/GhafCore \
            2>&1 | tee core-tests.log

      - name: Build and launch on iPhone 17 simulator
        run: |
          set -euo pipefail
          DEVICE_LINE="$(xcrun simctl list devices available | grep -m1 -E 'iPhone 17 \(' || xcrun simctl list devices available | grep -m1 -E 'iPhone .* \(' || true)"
          DEVICE_ID="$(printf '%s\n' "$DEVICE_LINE" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "$DEVICE_LINE" ]; then
            echo "No available iPhone simulator was found."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark

          set -o pipefail
          xcodebuild \
            -project Ghaf.xcodeproj \
            -scheme Ghaf \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build/SimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log

          SIM_APP="build/SimulatorDerived/Build/Products/Debug-iphonesimulator/Ghaf.app"
          test -d "$SIM_APP"
          xcrun simctl install "$DEVICE_ID" "$SIM_APP"
          xcrun simctl launch "$DEVICE_ID" com.ghaf.app
          # Allow the launch animation and SwiftData initialization to finish.
          sleep 8
          mkdir -p build/preview
          xcrun simctl io "$DEVICE_ID" screenshot build/preview/ghaf-iphone-17.png

      - name: Archive unsigned application
        run: |
          set -o pipefail
          xcodebuild \
            -project Ghaf.xcodeproj \
            -scheme Ghaf \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/Ghaf.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log

      - name: Verify device compatibility metadata
        run: |
          set -euo pipefail
          APP_PATH="build/Ghaf.xcarchive/Products/Applications/Ghaf.app"
          PLIST="$APP_PATH/Info.plist"
          SDK_NAME=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$PLIST")
          echo "Archived SDK: $SDK_NAME"
          case "$SDK_NAME" in
            iphoneos*) ;;
            *) echo "Unexpected archive SDK: $SDK_NAME"; exit 1 ;;
          esac
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$PLIST"
          if /usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$PLIST" >/dev/null 2>&1; then
            echo "UIRequiresFullScreen must not be present."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$PLIST"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Ghaf.xcarchive/Products/Applications/Ghaf.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Ghaf.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Ghaf.ipa
          unzip -t Ghaf.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          path: Ghaf.ipa
          # Upload the .ipa itself, not wrapped in a zip: sideloading apps reject a zip with no Payload/ inside.
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish release with IPA
        # One release per version: a push without a version bump (or a re-run) finds the tag and skips.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PLIST="build/Ghaf.xcarchive/Products/Applications/Ghaf.app/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          TAG="v${VERSION}-${BUILD}"
          # Notes: this version's section of CHANGELOG.md (English and Arabic).
          awk -v heading="## ${VERSION} (${BUILD})" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Ghaf ${VERSION} (${BUILD})" > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its IPA and refreshing source.json."
          else
            gh release create "$TAG" Ghaf.ipa \
              --title "Ghaf ${VERSION} (${BUILD})" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
          # The source must describe the IPA actually attached to the release.
          gh release download "$TAG" --pattern Ghaf.ipa --output release.ipa --clobber
          # AltStore-format source for FlareStore, Feather, SideStore…; added once at
          # releases/latest/download/source.json, which always points to the newest release.
          VERSION="$VERSION" BUILD="$BUILD" TAG="$TAG" SIZE=$(stat -f%z release.ipa) REPO="$GITHUB_REPOSITORY" python3 - <<'PY'
          import json, os, datetime
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          raw = f"https://raw.githubusercontent.com/{repo}/main"
          source = {
              "name": "Ghaf",
              "identifier": "com.ghaf.source",
              "subtitle": "Personal finance for the UAE",
              "website": f"https://github.com/{repo}",
              "iconURL": f"{raw}/Ghaf/Assets.xcassets/AppIcon.appiconset/ghaf-app-icon.png",
              "tintColor": "8A5A24",
              "apps": [{
                  "name": "Ghaf",
                  "bundleIdentifier": "com.ghaf.app",
                  "developerName": "Ghaf",
                  "subtitle": "Personal finance for the UAE",
                  "localizedDescription": "Track accounts, transactions, subscriptions and budgets in Arabic and English.",
                  "iconURL": f"{raw}/Ghaf/Assets.xcassets/AppIcon.appiconset/ghaf-app-icon.png",
                  "tintColor": "8A5A24",
                  "category": "utilities",
                  "versions": [{
                      "version": os.environ["VERSION"],
                      "buildVersion": os.environ["BUILD"],
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": open("release-notes.md").read().strip(),
                      "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/Ghaf.ipa",
                      "size": int(os.environ["SIZE"]),
                      "minOSVersion": "17.0"
                  }],
                  # Older stores read these top-level fields instead of versions[].
                  "version": os.environ["VERSION"],
                  "versionDate": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
                  "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/Ghaf.ipa",
                  "size": int(os.environ["SIZE"])
              }],
              "news": []
          }
          json.dump(source, open("source.json", "w"), ensure_ascii=False, indent=2)
          PY
          gh release upload "$TAG" source.json --clobber

      - name: Upload iPhone 17 simulator preview
        uses: actions/upload-artifact@v7
        with:
          name: Ghaf-iPhone-17-preview
          path: build/preview/ghaf-iphone-17.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Ghaf-build-logs
          path: |
            xcodegen.log
            core-tests.log
            simulator-build.log
            build.log
            archive.log
          if-no-files-found: ignore
          retention-days: 7
