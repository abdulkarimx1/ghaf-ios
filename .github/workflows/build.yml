name: Build Ghaf iOS

on:
  workflow_dispatch:

concurrency:
  group: ghaf-ios-main-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Ghaf
    # Runs on the developer's own Mac; this avoids GitHub-hosted Actions minutes.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select iOS 27 toolchain
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_27.2.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode 27.2 was not found on this runner."
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          if [ "$(xcode-select -p)" != "$XCODE_PATH/Contents/Developer" ]; then
            echo "Select Xcode 27.2 on the Mac runner before starting the runner:"
            echo "sudo xcode-select -s \"$XCODE_PATH/Contents/Developer\""
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.2"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Test GhafCore
        run: |
          set -o pipefail
          swift test \
            --package-path Packages/GhafCore \
            2>&1 | tee core-tests.log

      - name: Build and launch on iPhone 17 simulator
        run: |
          set -euo pipefail
          DEVICE_LINE="$(xcrun simctl list devices available | grep -m1 'iPhone 17 (')"
          DEVICE_ID="$(printf '%s\n' "$DEVICE_LINE" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "$DEVICE_LINE" ]; then
            echo "The iPhone 17 simulator was not found."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark

          set -o pipefail
          xcodebuild \
            -project Ghaf.xcodeproj \
            -scheme Ghaf \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build/SimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log

          SIM_APP="build/SimulatorDerived/Build/Products/Debug-iphonesimulator/Ghaf.app"
          test -d "$SIM_APP"
          xcrun simctl install "$DEVICE_ID" "$SIM_APP"
          xcrun simctl launch "$DEVICE_ID" com.ghaf.app
          # Allow the launch animation and SwiftData initialization to finish.
          sleep 8
          mkdir -p build/preview
          xcrun simctl io "$DEVICE_ID" screenshot build/preview/ghaf-iphone-17.png

      - name: Archive unsigned application
        run: |
          set -o pipefail
          xcodebuild \
            -project Ghaf.xcodeproj \
            -scheme Ghaf \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/Ghaf.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log

      - name: Verify device compatibility metadata
        run: |
          set -euo pipefail
          APP_PATH="build/Ghaf.xcarchive/Products/Applications/Ghaf.app"
          PLIST="$APP_PATH/Info.plist"
          SDK_NAME=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$PLIST")
          echo "Archived SDK: $SDK_NAME"
          test "$SDK_NAME" = "iphoneos27.2"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$PLIST"
          if /usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$PLIST" >/dev/null 2>&1; then
            echo "UIRequiresFullScreen must not be present."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$PLIST"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Ghaf.xcarchive/Products/Applications/Ghaf.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Ghaf.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Ghaf.ipa
          unzip -t Ghaf.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: Ghaf-unsigned-ipa
          path: Ghaf.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload iPhone 17 simulator preview
        uses: actions/upload-artifact@v7
        with:
          name: Ghaf-iPhone-17-preview
          path: build/preview/ghaf-iphone-17.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Ghaf-build-logs
          path: |
            xcodegen.log
            core-tests.log
            simulator-build.log
            build.log
            archive.log
          if-no-files-found: ignore
          retention-days: 7
