name: Ghaf

options:
  bundleIdPrefix: com.ghaf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"
  projectFormat: xcode16_0

packages:
  GhafCore:
    path: Packages/GhafCore
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    version: 1.19.7

schemes:
  Ghaf:
    build:
      targets:
        Ghaf: all
        GhafUITests: [test]
    test:
      config: Debug
      targets:
        - target: GhafUITests
        - target: GhafSnapshotTests

targets:
  GhafUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GhafUITests]
    dependencies:
      - target: Ghaf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app.uitests
  GhafSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GhafSnapshotTests]
    dependencies:
      - target: Ghaf
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app.snapshottests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ghaf.app/Ghaf"
        BUNDLE_LOADER: "$(TEST_HOST)"
  Ghaf:
    scheme:
      storeKitConfiguration: Ghaf/Resources/Ghaf.storekit
      testTargets:
        - GhafUITests
        - GhafSnapshotTests
    type: application
    platform: iOS
    sources:
      - path: Ghaf
      - path: Shared
      - path: GhafWidgets
        excludes: [PrivacyInfo.xcprivacy]
    dependencies:
      - package: GhafCore
        product: GhafCore
      - target: GhafWidgets

    info:
      path: BuildConfig/Generated-Info.plist
      properties:
        CFBundleDisplayName: Ghaf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ar
        NSFaceIDUsageDescription: Ghaf uses Face ID or your device passcode to protect your financial information.
        NSLocationWhenInUseUsageDescription: Ghaf can add the place to a manual transaction. Place details stay on this iPhone; Apple Maps finds the name.
        NSMicrophoneUsageDescription: Ghaf uses the microphone when you choose to record a transaction by voice or talk to Ghaf AI.
        NSSpeechRecognitionUsageDescription: Ghaf converts your spoken transaction details into editable text on your device.
        UIAppFonts:
          - IBMPlexSans-Variable.ttf
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
          - ThmanyahSerifDisplay-Regular.otf
          - ThmanyahSerifDisplay-Black.otf
          - Geist-Variable.ttf
        UILaunchScreen:
          UIColorName: GhafLaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - ghaf
            CFBundleURLName: com.ghaf.app.transaction
        # iOS OAuth client ID from Google Cloud Console (Drive backup). Empty = Drive sign-in hidden behind a setup note.
        GHAF_GOOGLE_CLIENT_ID: ""
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - waze
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app
        PRODUCT_NAME: Ghaf
        MARKETING_VERSION: "1.31"
        CURRENT_PROJECT_VERSION: "53"
        CODE_SIGN_ENTITLEMENTS: Config/Ghaf.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  GhafWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GhafWidgets
      - path: Shared
    info:
      path: BuildConfig/GhafWidgets-Info.plist
      properties:
        CFBundleDisplayName: Ghaf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Geist-Variable.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app.widgets
        PRODUCT_NAME: GhafWidgets
        MARKETING_VERSION: "1.31"
        CURRENT_PROJECT_VERSION: "53"
        CODE_SIGN_ENTITLEMENTS: Config/GhafWidgets.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
