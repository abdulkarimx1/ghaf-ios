name: Ghaf

options:
  bundleIdPrefix: com.ghaf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"
  projectFormat: xcode16_0

packages:
  GhafCore:
    path: Packages/GhafCore

targets:
  Ghaf:
    type: application
    platform: iOS
    sources:
      - path: Ghaf
    dependencies:
      - package: GhafCore
        product: GhafCore

    info:
      path: BuildConfig/Generated-Info.plist
      properties:
        CFBundleDisplayName: Ghaf
        NSFaceIDUsageDescription: Ghaf uses Face ID or your device passcode to protect your financial information.
        UIAppFonts:
          - IBMPlexSans-Variable.ttf
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
          - ThmanyahSerifDisplay-Regular.otf
          - ThmanyahSerifDisplay-Black.otf
        UILaunchScreen:
          UIColorName: GhafLaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSupportsIndirectInputEvents: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app
        PRODUCT_NAME: Ghaf
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
