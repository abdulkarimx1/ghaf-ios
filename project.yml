name: Ghaf

options:
  bundleIdPrefix: com.ghaf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"
  projectFormat: xcode16_0

packages:
  GhafCore:
    path: Packages/GhafCore

targets:
  GhafUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GhafUITests]
    dependencies:
      - target: Ghaf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app.uitests
  Ghaf:
    scheme:
      storeKitConfiguration: Ghaf/Resources/Ghaf.storekit
    type: application
    platform: iOS
    sources:
      - path: Ghaf
      - path: Shared
    dependencies:
      - package: GhafCore
        product: GhafCore
      - target: GhafWidgets

    info:
      path: BuildConfig/Generated-Info.plist
      properties:
        CFBundleDisplayName: Ghaf
        CFBundleShortVersionString: "1.25"
        CFBundleVersion: "39"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ar
        NSFaceIDUsageDescription: Ghaf uses Face ID or your device passcode to protect your financial information.
        NSLocationWhenInUseUsageDescription: Ghaf uses your location only while you choose where a purchase happened, to show nearby places first.
        NSMicrophoneUsageDescription: Ghaf uses the microphone when you choose to record transaction details or have a live voice call.
        NSSpeechRecognitionUsageDescription: Ghaf converts your spoken transaction details into editable text on your device.
        UIAppFonts:
          - IBMPlexSans-Variable.ttf
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
          - ThmanyahSerifDisplay-Regular.otf
          - ThmanyahSerifDisplay-Black.otf
        UILaunchScreen:
          UIColorName: GhafLaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - ghaf
            CFBundleURLName: com.ghaf.app.transaction
        # iOS OAuth client ID from Google Cloud Console (Drive backup). Empty = Drive sign-in hidden behind a setup note.
        GHAF_GOOGLE_CLIENT_ID: ""
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app
        PRODUCT_NAME: Ghaf
        CODE_SIGN_ENTITLEMENTS: Config/Ghaf.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  GhafWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GhafWidgets
      - path: Shared
    info:
      path: BuildConfig/GhafWidgets-Info.plist
      properties:
        CFBundleDisplayName: Ghaf
        CFBundleShortVersionString: "1.25"
        CFBundleVersion: "39"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghaf.app.widgets
        PRODUCT_NAME: GhafWidgets
        CODE_SIGN_ENTITLEMENTS: Config/GhafWidgets.entitlements
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
